app = "feelky"
primary_region = "ams"

[build]

# Migrations run on every deploy, before the new version takes traffic.
[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  # Kept warm: a Telegram entry should answer instantly, not wait for a cold boot.
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
